<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Flappy Michael</title>
    <link rel="stylesheet" href="../css/flying.css">
</head>
<style>
        body{
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: 'medievalsharp';
        }
        .text-div{
            background-color: burlywood;
            border: 2px solid black;
            border-radius: 5px;
            padding: 5px;
            margin: 5px;
        }
        .button-div{
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 35vh;
        }
        .button-grid button {
            padding: 20px;
            font-size: 16px;
         }
        .choice-button {
            height: 100px;
            width: 200px;
            background-color: burlywood;
            border: 2px solid black;
            border-radius: 5px;
            padding: 5px;
            margin: 5px;
        }
</style>
<body>
    <div class="text-div">
        <p>
            Your friend is throwing fruits at you, dodge em!
        </p>
    </div>

    <div id="game">
        <div id="character"></div>
        <div id="score">0</div>
        <div id="startMessage">Click anywhere to start</div>
    </div>
    <div class="quit">
        <a href="Nighttime.html">QUIT</a>
    </div>
</body>
<script src="../js/flying.js"></script>
</html>
