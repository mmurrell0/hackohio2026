<!DOCTYPE html>
<html>
<head>
<link href="https://fonts.googleapis.com/css2?family=MedievalSharp&display=swap" rel="stylesheet">
<style>
html, body {
height: 100%;
width: 100%;
margin:0;
overflow: hidden;
}
body {
    background-image: url('bestvillage.png');
    background-repeat: no-repeat;
    background-position: center;
    background-size: cover;
}
.scene-container {
    position: relative;
    width: 100vw;
    height: 100vh;
}
.speech-bubble {
  position: absolute; 
  background: white;
  color: rgb(129, 54, 209);
  padding: 25px;
  width: 500px;
  font-family: 'medievalsharp';
  border: 8px solid rgb(129, 54, 209);
  border-radius: 12px;
  top: 8vh;
  left: 550px;
  height: 300px;
  box-sizing:border-box;
}
.speech-bubble::before {
    content:"";
    position: absolute;
    bottom:-28px;
    left: 25px;
    width:0;
    height:0;
    border-left: 20px solid transparent;
    border-right: 20px solid transparent;
    border-top: 20px solid rgb(129, 54, 209);
    z-index: 1;
}
.speech-bubble::after {
  content: "";
  position: absolute;
  bottom: -13.5px;    
  left: 31px;        
  width: 0;
  height: 0;
  border-left: 14px solid transparent;
  border-right: 14px solid transparent;
  border-top: 14px solid white; 
  z-index: 2;
}
.fairy-image {
    position: absolute;
    top: 18vh;
    left: 10vw;
    width: 800px; 
    height: auto;
    z-index: 10;
}
</style>
</head>
<body>
    <div class="scene-container">
    <img src="/html/Happy Fairy.png" class="fairy-image" alt="Happy Fairy">
    <div class="speech-bubble">
        Help!
    </div>
</body>
</html>
